name: cross-platform-build

# Builds one exact Lato native target per matrix job using
# `script/build.ts --target <name>`.
#
# Bun cross-compiles every target from any host (verified locally: x64 Linux
# produced an aarch64 Linux ELF). Because cross-target builds need the other
# platforms' native dependency packages, --skip-install is intentionally NOT
# passed; script/build.ts then installs them with --os=* --cpu=* --libc=*.
#
# Runner architecture (explicit, not inferred from the OS label):
#   ubuntu-latest      -> Linux x64
#   ubuntu-24.04-arm   -> Linux arm64 (GitHub-hosted arm64; public repos)
#   macos-14           -> macOS arm64 (Apple Silicon)
#   windows-latest     -> Windows x64
#
# GitHub no longer offers a hosted Intel macOS runner, so macOS x64 is
# cross-compiled on Apple Silicon and executed through Rosetta 2 when present;
# otherwise it is build-only (reported, never faked). There is no hosted Windows
# arm64 runner, so Windows arm64 is cross-compiled and not runtime-verified.

on:
  workflow_dispatch:
  push:
    branches:
      - lato-development
  pull_request:

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build (${{ matrix.target.name }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - {
              name: "lato-linux-x64",
              platform: "linux",
              arch: "x64",
              runner: "ubuntu-latest",
              smoke: "native",
              native_arch: true,
            }
          - {
              name: "lato-linux-x64-baseline",
              platform: "linux",
              arch: "x64",
              runner: "ubuntu-latest",
              smoke: "native",
              native_arch: true,
            }
          - {
              name: "lato-linux-x64-musl",
              platform: "linux",
              arch: "x64",
              runner: "ubuntu-latest",
              smoke: "docker",
              docker_platform: "linux/amd64",
              native_arch: true,
            }
          - {
              name: "lato-linux-x64-baseline-musl",
              platform: "linux",
              arch: "x64",
              runner: "ubuntu-latest",
              smoke: "docker",
              docker_platform: "linux/amd64",
              native_arch: true,
            }
          - {
              name: "lato-linux-arm64",
              platform: "linux",
              arch: "arm64",
              runner: "ubuntu-24.04-arm",
              smoke: "native",
              native_arch: true,
            }
          - {
              name: "lato-linux-arm64-musl",
              platform: "linux",
              arch: "arm64",
              runner: "ubuntu-24.04-arm",
              smoke: "docker",
              docker_platform: "linux/arm64",
              native_arch: true,
            }
          - {
              name: "lato-darwin-arm64",
              platform: "darwin",
              arch: "arm64",
              runner: "macos-14",
              smoke: "native",
              native_arch: true,
            }
          - {
              name: "lato-darwin-x64",
              platform: "darwin",
              arch: "x64",
              runner: "macos-14",
              smoke: "rosetta",
              native_arch: false,
            }
          - {
              name: "lato-darwin-x64-baseline",
              platform: "darwin",
              arch: "x64",
              runner: "macos-14",
              smoke: "rosetta",
              native_arch: false,
            }
          - {
              name: "lato-windows-x64",
              platform: "windows",
              arch: "x64",
              runner: "windows-latest",
              smoke: "native",
              native_arch: true,
            }
          - {
              name: "lato-windows-x64-baseline",
              platform: "windows",
              arch: "x64",
              runner: "windows-latest",
              smoke: "native",
              native_arch: true,
            }
          - {
              name: "lato-windows-arm64",
              platform: "windows",
              arch: "arm64",
              runner: "windows-latest",
              smoke: "none",
              native_arch: false,
            }
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Assert runner architecture matches target
        if: matrix.target.native_arch == true
        run: |
          case "${{ matrix.target.arch }}" in
            x64) want="X64" ;;
            arm64) want="ARM64" ;;
          esac
          if [ "${{ runner.arch }}" != "$want" ]; then
            echo "::error::Runner arch ${{ runner.arch }} does not match target arch ${{ matrix.target.arch }} (${{ matrix.target.name }})"
            exit 1
          fi
          echo "Runner ${{ matrix.target.runner }} (${{ runner.arch }}) matches native target ${{ matrix.target.name }}"

      - name: Build exact target
        working-directory: packages/opencode
        run: |
          bun run script/build.ts --target "${{ matrix.target.name }}" --skip-embed-web-ui

      - name: Verify native binary
        if: matrix.target.smoke == 'native'
        working-directory: packages/opencode
        run: |
          BIN="dist/${{ matrix.target.name }}/bin/lato${{ matrix.target.platform == 'windows' && '.exe' || '' }}"
          if [ ! -f "$BIN" ]; then
            echo "::error::Expected binary not found: $BIN"
            exit 1
          fi
          chmod +x "$BIN" || true
          "$BIN" --version

      - name: Verify musl binary in Alpine
        if: matrix.target.smoke == 'docker'
        working-directory: packages/opencode
        run: |
          BIN="dist/${{ matrix.target.name }}/bin/lato"
          if [ ! -f "$BIN" ]; then
            echo "::error::Expected binary not found: $BIN"
            exit 1
          fi
          chmod +x "$BIN"
          # The musl binaries dynamically link libstdc++/libgcc, matching the
          # runtime deps the Dockerfile installs. Alpine's base image lacks them,
          # so install them in the matching architecture before executing.
          docker run --rm --platform "${{ matrix.target.docker_platform }}" \
            -v "$PWD/dist/${{ matrix.target.name }}/bin:/app:ro" \
            alpine:3.20 sh -c 'apk add --no-cache libstdc++ libgcc >/dev/null && /app/lato --version'

      - name: Verify macOS x64 via Rosetta
        if: matrix.target.smoke == 'rosetta'
        working-directory: packages/opencode
        run: |
          BIN="dist/${{ matrix.target.name }}/bin/lato"
          if [ ! -f "$BIN" ]; then
            echo "::error::Expected binary not found: $BIN"
            exit 1
          fi
          chmod +x "$BIN"
          if arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            AVX="$(arch -x86_64 sysctl -n hw.optional.avx1_0 2>/dev/null || true)"
            if [ "$AVX" = "1" ]; then
              arch -x86_64 "$BIN" --version
            else
              echo "::warning::x86_64 Rosetta is available but AVX is unavailable; Bun 1.4.4 cannot execute ${{ matrix.target.name }} on this runner. Build-only verification is used."
            fi
          else
            echo "::warning::Rosetta 2 is unavailable; ${{ matrix.target.name }} is build-only on this runner and is not runtime-verified."
          fi

      - name: Note cross-compiled target without runtime verification
        if: matrix.target.smoke == 'none'
        run: |
          echo "::warning::${{ matrix.target.name }} was cross-compiled on ${{ matrix.target.runner }}; no hosted runner can execute it, so runtime verification is intentionally skipped."

      - name: Package archive (Linux)
        if: matrix.target.platform == 'linux'
        working-directory: packages/opencode
        run: |
          mkdir -p out
          bun run script/archive.ts assemble \
            --target "${{ matrix.target.name }}" \
            --binary "dist/${{ matrix.target.name }}/bin/lato" \
            --output "out/${{ matrix.target.name }}.tar.gz"

      - name: Package archive (macOS)
        if: matrix.target.platform == 'darwin'
        working-directory: packages/opencode
        run: |
          mkdir -p out
          bun run script/archive.ts assemble \
            --target "${{ matrix.target.name }}" \
            --binary "dist/${{ matrix.target.name }}/bin/lato" \
            --output "out/${{ matrix.target.name }}.zip"

      - name: Package archive (Windows)
        if: matrix.target.platform == 'windows'
        shell: pwsh
        working-directory: packages/opencode
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          bun run script/archive.ts assemble `
            --target "${{ matrix.target.name }}" `
            --binary "dist/${{ matrix.target.name }}/bin/lato.exe" `
            --output "out/${{ matrix.target.name }}.zip"

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target.name }}
          path: packages/opencode/out/
          if-no-files-found: error

  validate-archives:
    name: validate archives and checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Download build archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: lato-*
          path: packages/opencode/out
          merge-multiple: true

      - name: Validate archive set
        working-directory: packages/opencode
        run: |
          for archive in out/*.tar.gz out/*.zip; do
            [ -f "$archive" ] || continue
            target="$(basename "$archive" | sed -E 's/\.(tar\.gz|zip)$//')"
            bun run script/archive.ts validate --target "$target" --archive "$archive"
          done

      - name: Generate and validate SHA256SUMS
        working-directory: packages/opencode
        run: |
          bun run script/archive.ts manifest --dir out --output out/SHA256SUMS
          bun run script/archive.ts validate-manifest --dir out --manifest out/SHA256SUMS

      - name: Upload validated archive manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lato-sha256sums
          path: packages/opencode/out/SHA256SUMS
          if-no-files-found: error

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run CLI identity tests
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/cli/identity.test.ts

      - name: Run executable entry point tests
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/cli/executables.test.ts

      - name: Run native state resolution tests
        working-directory: packages/opencode
        run: bun test --timeout 30000 test/cli/native-state.test.ts

      - name: Run TUI preference persistence tests
        working-directory: packages/tui
        run: bun test --timeout 30000 test/prompt/persistence.test.ts

      - name: Run TUI runtime tests
        working-directory: packages/tui
        run: bun test --timeout 30000 test/runtime.test.tsx

      - name: Validate installer fixture contract
        if: matrix.os == 'ubuntu-latest'
        run: bash packages/opencode/script/installer-fixtures.sh

      - name: Validate PowerShell installer syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'install.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
